[workspace]
resolver = "3"
members = ["crates/core","src-tauri"]

# Profiles only take effect in the workspace root, so this moved here from src-tauri/Cargo.toml.
# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
